<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printing Name</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="form-container">
    <h1>Student Details</h1>

     <form class="form" method="GET">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe">

        <label for="roll number">Roll Number</label>
        <input type="email" id="email" name="Email" placeholder="johndoe@email.com">

        <label for="Branch">Branch</label>
        <input type="text" id="Branch" name="Branch" placeholder="Mechanical">

        <label for="Goal">Goal</label>
        <input type="text" id="goal" name="Goal" placeholder="Reseach Engineer">

        <div class="buttons">
            <button >
                Submit
            </button>

            <button>
                Reset
            </button>

            <button>
                Cancel
            </button>
        </div>

    </form>
   </div>
   
</html>
